name: Runtime generation lanes

on:
  pull_request:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-generation-lanes:
    name: runtime-generation-lanes (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build runtime
        run: npm run build

      - name: Verify generation authority and lane discovery
        env:
          SERVICE_LASSO_INSTANCE_REGISTRY_PATH: ${{ runner.temp }}/service-lasso-test-instances.json
        run: node --test --test-concurrency=1 --test-force-exit tests/process-ownership.test.js tests/registry-runtime-state.test.js

      - name: Verify canonical generation mismatch handling
        run: node --test --test-name-pattern="canonical demo verifier" tests/demo-instance.test.js
