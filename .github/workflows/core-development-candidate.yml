name: Core Development Candidate

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Full commit SHA already reachable from develop
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: core-development-candidate-${{ inputs.candidate_sha }}
  cancel-in-progress: false

env:
  CANDIDATE_SHA: ${{ inputs.candidate_sha }}
  DISPATCH_SHA: ${{ github.sha }}

jobs:
  build-candidate:
    if: ${{ github.ref == 'refs/heads/develop' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    outputs:
      artifact_name: core-development-candidate-${{ env.CANDIDATE_SHA }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_digest: ${{ steps.upload.outputs.artifact-digest }}
      dispatch_sha: ${{ env.DISPATCH_SHA }}
    steps:
      - name: Check out requested exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CANDIDATE_SHA }}
          fetch-depth: 0

      - name: Verify exact develop ancestry
        shell: bash
        run: |
          set -euo pipefail
          [[ "${CANDIDATE_SHA}" =~ ^[0-9a-f]{40}$ ]]
          test "${CANDIDATE_SHA}" = "$(git rev-parse HEAD)"
          git merge-base --is-ancestor "${CANDIDATE_SHA}" origin/develop

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Build checksum-bound development candidate
        env:
          SERVICE_LASSO_RELEASE_METADATA_TOKEN: ${{ github.token }}
        run: npm run build && node scripts/create-development-candidate.mjs

      - name: Upload candidate archives and manifests
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: core-development-candidate-${{ env.CANDIDATE_SHA }}
          path: artifacts/development-candidate
          if-no-files-found: error
          retention-days: 14

      - name: Read back uploaded candidate digest
        env:
          GH_TOKEN: ${{ github.token }}
          DEVELOPMENT_CANDIDATE_ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          DEVELOPMENT_CANDIDATE_ARTIFACT_NAME: core-development-candidate-${{ env.CANDIDATE_SHA }}
          DEVELOPMENT_CANDIDATE_ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          DEVELOPMENT_CANDIDATE_DISPATCH_SHA: ${{ env.DISPATCH_SHA }}
        run: node scripts/verify-development-candidate-artifact.mjs

  smoke-consumer:
    needs: build-candidate
    runs-on: ${{ matrix.os }}
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win32
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: darwin
    steps:
      - name: Check out exact candidate consumer verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CANDIDATE_SHA }}

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked consumer verifier dependencies
        run: npm ci

      - name: Verify immutable uploaded candidate identity
        env:
          GH_TOKEN: ${{ github.token }}
          DEVELOPMENT_CANDIDATE_ARTIFACT_ID: ${{ needs.build-candidate.outputs.artifact_id }}
          DEVELOPMENT_CANDIDATE_ARTIFACT_NAME: ${{ needs.build-candidate.outputs.artifact_name }}
          DEVELOPMENT_CANDIDATE_ARTIFACT_DIGEST: ${{ needs.build-candidate.outputs.artifact_digest }}
          DEVELOPMENT_CANDIDATE_DISPATCH_SHA: ${{ needs.build-candidate.outputs.dispatch_sha }}
        run: node scripts/verify-development-candidate-artifact.mjs

      - name: Download candidate artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.build-candidate.outputs.artifact_id }}
          path: candidate

      - name: Verify clean consumer startup and health
        env:
          DEVELOPMENT_CANDIDATE_ROOT: candidate
          DEVELOPMENT_CANDIDATE_PLATFORM: ${{ matrix.platform }}
        run: node scripts/verify-development-candidate.mjs
