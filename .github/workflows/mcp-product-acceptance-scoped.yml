name: MCP Product Acceptance Scoped

on:
  workflow_dispatch:

concurrency:
  group: mcp-product-acceptance-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CANDIDATE_SHA: ${{ github.sha }}

jobs:
  mcp-source-conformance:
    if: ${{ github.ref == 'refs/heads/develop' }}
    name: mcp-source-conformance
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CANDIDATE_SHA }}

      - name: Bind exact source-owned scoped policy
        run: node scripts/bind-scoped-workflow-source.mjs

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run blocking MCP source conformance matrix
        run: npm run test:mcp:product

      - name: Build tested operator documentation
        run: npm run docs:build

  mcp-packaged:
    if: ${{ github.ref == 'refs/heads/develop' }}
    name: mcp-packaged (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win32
          - os: ubuntu-latest
            platform: linux
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CANDIDATE_SHA }}

      - name: Bind exact source-owned scoped policy
        run: node scripts/bind-scoped-workflow-source.mjs

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Compute candidate package version
        shell: pwsh
        run: |
          $shortSha = $env:CANDIDATE_SHA.Substring(0, 7)
          $dateUtc = [DateTime]::UtcNow.ToString('yyyy.M.d')
          "SERVICE_LASSO_RELEASE_VERSION=$dateUtc-$shortSha" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build packaged MCP verifier
        run: npm run build

      - name: Verify fresh-consumer packaged MCP and canonical action
        env:
          MCP_PRODUCT_EVIDENCE_PATH: artifacts/mcp-product-${{ matrix.platform }}.json
          SERVICE_LASSO_RELEASE_METADATA_TOKEN: ${{ github.token }}
        run: node scripts/verify-mcp-packaged-bootstrap-scoped.mjs

      - name: Upload exact-SHA metadata-only MCP product evidence
        id: mcp_product_artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mcp-product-acceptance-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/mcp-product-${{ matrix.platform }}.json
          if-no-files-found: error
          retention-days: 90

      - name: Download and validate retained MCP product evidence
        env:
          GH_TOKEN: ${{ github.token }}
          MCP_PRODUCT_PLATFORM: ${{ matrix.platform }}
          MCP_PRODUCT_ARTIFACT_ID: ${{ steps.mcp_product_artifact.outputs.artifact-id }}
          MCP_PRODUCT_ARTIFACT_NAME: mcp-product-acceptance-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          MCP_PRODUCT_ARTIFACT_DIGEST: ${{ steps.mcp_product_artifact.outputs.artifact-digest }}
        run: node scripts/verify-mcp-product-artifact.mjs

  require-mcp-product-acceptance:
    if: ${{ always() && github.ref == 'refs/heads/develop' }}
    needs:
      - mcp-source-conformance
      - mcp-packaged
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Require source and Windows/Linux packaged acceptance
        shell: bash
        run: |
          set -euo pipefail
          test '${{ needs.mcp-source-conformance.result }}' = 'success'
          test '${{ needs.mcp-packaged.result }}' = 'success'

      - name: Check out exact candidate verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CANDIDATE_SHA }}

      - name: Bind exact source-owned scoped policy
        run: node scripts/bind-scoped-workflow-source.mjs

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked verifier dependencies
        run: npm ci

      - name: Read back the complete retained artifact set
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run build && node scripts/collect-scoped-mcp-qualification.mjs
