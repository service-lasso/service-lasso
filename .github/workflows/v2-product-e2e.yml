name: Operator v2 product E2E

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  v2-product-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          path: core
      - uses: actions/checkout@v4
        with:
          repository: service-lasso/service-lasso-cli
          ref: develop
          path: cli
      - uses: actions/checkout@v4
        with:
          repository: service-lasso/service-lasso-tui
          ref: develop
          path: tui
      - uses: actions/checkout@v4
        with:
          path: core-e2e
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Core and CLI dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm --prefix ../cli ci --ignore-scripts --no-audit --no-fund
          npm --prefix ../core-e2e ci --ignore-scripts --no-audit --no-fund
        working-directory: core
      - name: Run Core, CLI and TUI suites without early exit
        working-directory: core
        env:
          SERVICE_LASSO_CLI_ROOT: ${{ github.workspace }}/cli
          SERVICE_LASSO_TUI_ROOT: ${{ github.workspace }}/tui
          SERVICE_LASSO_TUI_E2E_CORE: ${{ github.workspace }}/core-e2e
          SERVICE_LASSO_TUI_E2E_REVISION: ${{ github.sha }}
        run: npm run e2e:v2
