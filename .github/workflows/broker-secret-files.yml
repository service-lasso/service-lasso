name: Broker secret files

on:
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-secret-files:
    name: secret-files (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
    steps:
      - name: Check out exact Core candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Check out pinned Broker source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: service-lasso/lasso-secretsbroker
          ref: 2fd98ee8e18395e28d402e00ab7e6e8911675600
          path: qualification/secret-files-broker
      - name: Check out pinned corrected Echo example
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: service-lasso/lasso-echoservice
          ref: 7bcee7cf9e3e9a352eb59beb4a9afcde4a307584
          path: qualification/secret-files-echo
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
      - name: Set up source-build Go toolchain
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: '1.26.6'
          cache-dependency-path: |
            qualification/secret-files-broker/go.sum
            qualification/secret-files-echo/go.sum
      - name: Build Core
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
      - name: Build pinned native consumers and require real integration
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $brokerRoot = Join-Path $PWD 'qualification/secret-files-broker'
          $echoRoot = Join-Path $PWD 'qualification/secret-files-echo'
          if ((git -C $brokerRoot rev-parse HEAD) -ne '2fd98ee8e18395e28d402e00ab7e6e8911675600') { throw 'Broker source identity mismatch' }
          if ((git -C $echoRoot rev-parse HEAD) -ne '7bcee7cf9e3e9a352eb59beb4a9afcde4a307584') { throw 'Echo source identity mismatch' }
          $suffix = if ($IsWindows) { '.exe' } else { '' }
          $brokerBin = Join-Path $env:RUNNER_TEMP "secret-files-broker$suffix"
          $echoBin = Join-Path $env:RUNNER_TEMP "secret-files-echo$suffix"
          Push-Location $brokerRoot
          try { go build -o $brokerBin ./cmd/secretsbroker; if ($LASTEXITCODE -ne 0) { throw 'Broker source build failed' } } finally { Pop-Location }
          Push-Location $echoRoot
          try { go build -o $echoBin .; if ($LASTEXITCODE -ne 0) { throw 'Echo source build failed' } } finally { Pop-Location }
          node --test "$echoRoot/examples/webdav/example.test.mjs"
          if ($LASTEXITCODE -ne 0) { throw 'Echo preparation/checker regression failed' }
          $env:SERVICE_LASSO_TEST_BROKER_BIN = $brokerBin
          $env:SERVICE_LASSO_TEST_ECHO_BIN = $echoBin
          $env:SERVICE_LASSO_TEST_ECHO_MANIFEST = Join-Path $echoRoot 'examples/webdav/service.json'
          $env:SERVICE_LASSO_TEST_ECHO_CHECK = Join-Path $echoRoot 'examples/webdav/check.mjs'
          $env:SERVICE_LASSO_REQUIRE_SECRET_FILES_NATIVE = '1'
          $env:SERVICE_LASSO_WORKSPACE_ROOT = Join-Path $env:RUNNER_TEMP 'secret-files-workspace'
          $env:SERVICE_LASSO_INSTANCE_REGISTRY_PATH = Join-Path $env:RUNNER_TEMP 'secret-files-instances.json'
          $env:SERVICE_LASSO_HOST_PORT_REGISTRY_PATH = Join-Path $env:RUNNER_TEMP 'secret-files-ports.json'
          node --test --test-concurrency=1 tests/broker-file-declarations.test.js tests/ephemeral-secret-files.test.js tests/ram-webdav-secret-files.test.js tests/config-drift.test.js tests/variable-selector-planning.test.js tests/manifest-discovery.test.js tests/secret-reference-audit.test.js tests/dependency-graph.test.js
          if ($LASTEXITCODE -ne 0) { throw 'Native Broker/Core/Echo qualification failed' }
