name: Release Artifact

on:
  workflow_dispatch:

env:
  CANDIDATE_SHA: ${{ github.sha }}

jobs:
  qualify-mcp-packaged:
    name: mcp-packaged (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win32
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: darwin
    steps:
      - name: Check out exact publication candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.CANDIDATE_SHA }}

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Compute candidate package version
        shell: pwsh
        run: |
          $shortSha = $env:CANDIDATE_SHA.Substring(0, 7)
          $dateUtc = [DateTime]::UtcNow.ToString('yyyy.M.d')
          "SERVICE_LASSO_RELEASE_VERSION=$dateUtc-$shortSha" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify fresh-consumer packaged MCP before publication
        env:
          MCP_PRODUCT_EVIDENCE_PATH: artifacts/mcp-product-${{ matrix.platform }}.json
        run: npm run verify:mcp:packaged

      - name: Upload exact-SHA publication MCP evidence
        id: release_publish_mcp_artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: release-publish-mcp-product-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/mcp-product-${{ matrix.platform }}.json
          if-no-files-found: error
          retention-days: 90

      - name: Download and validate publication MCP evidence
        env:
          GH_TOKEN: ${{ github.token }}
          MCP_PRODUCT_PLATFORM: ${{ matrix.platform }}
          MCP_PRODUCT_ARTIFACT_ID: ${{ steps.release_publish_mcp_artifact.outputs.artifact-id }}
          MCP_PRODUCT_ARTIFACT_NAME: release-publish-mcp-product-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          MCP_PRODUCT_ARTIFACT_DIGEST: ${{ steps.release_publish_mcp_artifact.outputs.artifact-digest }}
        run: node scripts/verify-mcp-product-artifact.mjs

  release-artifact:
    needs:
      - qualify-mcp-packaged
    runs-on: ubuntu-latest
    environment: release
    permissions:
      attestations: write
      contents: write
      id-token: write

    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Reject production dependency vulnerabilities
        run: npm run audit:production

      - name: Compute release version
        id: release_version
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          DATE_UTC="$(date -u +%Y.%-m.%-d)"
          VERSION="${DATE_UTC}-${SHORT_SHA}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "artifact_name=service-lasso-$VERSION" >> "$GITHUB_OUTPUT"
          echo "bundled_artifact_name=service-lasso-bundled-$VERSION" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: npm test

      - name: Verify bounded release artifact
        env:
          SERVICE_LASSO_RELEASE_VERSION: ${{ steps.release_version.outputs.version }}
        run: npm run release:verify

      - name: Validate staged release asset policy
        run: |
          TAG_NAME="${{ steps.release_version.outputs.version }}"
          mapfile -t ASSET_NAMES < <(node scripts/check-release-assets.mjs --expected "$TAG_NAME")
          (
            cd artifacts
            sha256sum "${ASSET_NAMES[@]:0:16}" > SHA256SUMS.txt
          )
          for asset_name in "${ASSET_NAMES[@]}"; do
            test -f "artifacts/${asset_name}"
          done
          node scripts/check-release-assets.mjs "$TAG_NAME" "${ASSET_NAMES[@]}"

      - name: Attest exact release assets
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            artifacts/*.tar.gz
            artifacts/*.zip
            artifacts/*.cdx.json
            artifacts/SHA256SUMS.txt

      - name: Verify signed provenance before publication
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG_NAME="${{ steps.release_version.outputs.version }}"
          mapfile -t ASSET_NAMES < <(node scripts/check-release-assets.mjs --expected "$TAG_NAME")
          for asset_name in "${ASSET_NAMES[@]}"; do
            gh attestation verify "artifacts/${asset_name}" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release-artifact.yml" \
              --source-digest "$GITHUB_SHA" \
              --source-ref "$GITHUB_REF" >/dev/null
          done

      - name: Upload staged artifact folder
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ steps.release_version.outputs.artifact_name }}
          path: artifacts/${{ steps.release_version.outputs.artifact_name }}

      - name: Upload packaged archive
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ steps.release_version.outputs.artifact_name }}-archive
          path: artifacts/${{ steps.release_version.outputs.artifact_name }}.tar.gz

      - name: Upload bundled artifact folder
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ steps.release_version.outputs.bundled_artifact_name }}
          path: artifacts/${{ steps.release_version.outputs.bundled_artifact_name }}

      - name: Upload bundled archive
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ steps.release_version.outputs.bundled_artifact_name }}-archive
          path: artifacts/${{ steps.release_version.outputs.bundled_artifact_name }}.tar.gz

      - name: Upload per-OS release archives
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ${{ steps.release_version.outputs.version }}-per-os-release-archives
          path: |
            artifacts/${{ steps.release_version.outputs.artifact_name }}-win32.zip
            artifacts/${{ steps.release_version.outputs.artifact_name }}-linux.tar.gz
            artifacts/${{ steps.release_version.outputs.artifact_name }}-darwin.tar.gz
            artifacts/${{ steps.release_version.outputs.bundled_artifact_name }}-win32.zip
            artifacts/${{ steps.release_version.outputs.bundled_artifact_name }}-linux.tar.gz
            artifacts/${{ steps.release_version.outputs.bundled_artifact_name }}-darwin.tar.gz
            artifacts/*.cdx.json
            artifacts/SHA256SUMS.txt

      - name: Create immutable GitHub release
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG_NAME="${{ steps.release_version.outputs.version }}"
          mapfile -t ASSET_NAMES < <(node scripts/check-release-assets.mjs --expected "$TAG_NAME")
          RELEASE_ASSETS=()
          for asset_name in "${ASSET_NAMES[@]}"; do RELEASE_ASSETS+=("artifacts/${asset_name}"); done
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists and is immutable." >&2
            exit 1
          fi
          gh release create "$TAG_NAME" "${RELEASE_ASSETS[@]}" \
            --target "${GITHUB_SHA}" \
            --title "$TAG_NAME" \
            --notes "Bounded runtime artifact release for service-lasso."

      - name: Verify GitHub release asset policy
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG_NAME="${{ steps.release_version.outputs.version }}"
          RELEASE_JSON="$(gh release view "$TAG_NAME" --json tagName,name,targetCommitish,isDraft,isPrerelease,assets)"
          test "$(jq -r '.tagName' <<<"$RELEASE_JSON")" = "$TAG_NAME"
          test "$(jq -r '.name' <<<"$RELEASE_JSON")" = "$TAG_NAME"
          test "$(jq -r '.targetCommitish' <<<"$RELEASE_JSON")" = "$GITHUB_SHA"
          test "$(jq -r '.isDraft' <<<"$RELEASE_JSON")" = "false"
          test "$(jq -r '.isPrerelease' <<<"$RELEASE_JSON")" = "false"
          mapfile -t EXPECTED_ASSET_NAMES < <(node scripts/check-release-assets.mjs --expected "$TAG_NAME")
          mapfile -t RELEASE_ASSET_NAMES < <(jq -r '.assets[].name' <<<"$RELEASE_JSON")
          node scripts/check-release-assets.mjs "$TAG_NAME" "${RELEASE_ASSET_NAMES[@]}"
          for asset_name in "${EXPECTED_ASSET_NAMES[@]}"; do
            local_digest="$(sha256sum "artifacts/${asset_name}" | cut -d' ' -f1)"
            remote_digest="$(jq -r --arg name "$asset_name" '.assets[] | select(.name == $name) | .digest' <<<"$RELEASE_JSON")"
            remote_size="$(jq -r --arg name "$asset_name" '.assets[] | select(.name == $name) | .size' <<<"$RELEASE_JSON")"
            test "$remote_digest" = "sha256:${local_digest}"
            test "$remote_size" -gt 0
          done
