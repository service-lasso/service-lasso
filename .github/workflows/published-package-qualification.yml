name: Published Package Three-OS Qualification

on:
  workflow_dispatch:
    inputs:
      core_release_id:
        description: Exact published Core GitHub release ID
        required: true
        type: string
      core_release_tag:
        description: Exact published Core tag and npm version
        required: true
        type: string
      core_revision:
        description: Exact 40-character Core release target SHA
        required: true
        type: string
      core_npm_version:
        description: Exact public npm package version
        required: true
        type: string
      core_win32_sha256:
        description: SHA-256 of the published unbundled Core Windows archive
        required: true
        type: string
      core_linux_sha256:
        description: SHA-256 of the published unbundled Core Linux archive
        required: true
        type: string
      core_darwin_sha256:
        description: SHA-256 of the published unbundled Core macOS archive
        required: true
        type: string
      core_npm_integrity:
        description: Exact SHA-512 SRI from the public npm registry
        required: true
        type: string

env:
  QUALIFICATION_CANDIDATE_SHA: ${{ github.sha }}

concurrency:
  group: published-package-qualification-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  published-package-qualification:
    name: published-package-qualification (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            core_suffix: linux.tar.gz
            core_sha256: ${{ inputs.core_linux_sha256 }}
          - os: windows-latest
            platform: win32
            core_suffix: win32.zip
            core_sha256: ${{ inputs.core_win32_sha256 }}
          - os: macos-latest
            platform: darwin
            core_suffix: darwin.tar.gz
            core_sha256: ${{ inputs.core_darwin_sha256 }}
    env:
      CORE_RELEASE_ID: ${{ inputs.core_release_id }}
      CORE_RELEASE_TAG: ${{ inputs.core_release_tag }}
      CORE_REVISION: ${{ inputs.core_revision }}
      CORE_NPM_VERSION: ${{ inputs.core_npm_version }}
      CORE_NPM_INTEGRITY: ${{ inputs.core_npm_integrity }}
      CORE_RELEASE_ASSET: service-lasso-${{ inputs.core_release_tag }}-${{ matrix.core_suffix }}
      CORE_RELEASE_SHA256: ${{ matrix.core_sha256 }}
      ADMIN_HARNESS_REVISION: 90caf8cf0f8e3c599a1a5022936813ac8bf0983b
      QUALIFICATION_PLATFORM: ${{ matrix.platform }}
      # Apply before checkout so Windows receives genuine tracked blob bytes.
      GIT_CONFIG_COUNT: "1"
      GIT_CONFIG_KEY_0: core.autocrlf
      GIT_CONFIG_VALUE_0: "false"

    steps:
      - name: Check out exact qualification harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Establish unique qualification custody before dependencies
        shell: bash
        run: |
          set -euo pipefail
          # Keep the runner-local checkout byte-stable before the first custody
          # inventory.  This is intentionally local to this disposable checkout.
          git config --local core.autocrlf false
          test "$(git config --local --get core.autocrlf)" = false
          test -z "$(git -c core.autocrlf=false status --porcelain=v1 --untracked-files=all)"
          qualification_root="$RUNNER_TEMP/published-package-qualification-$GITHUB_RUN_ID-$GITHUB_JOB-$GITHUB_RUN_ATTEMPT-$QUALIFICATION_PLATFORM"
          export SERVICE_LASSO_WORKSPACE_ROOT="$qualification_root/workspace"
          export SERVICE_LASSO_INSTANCE_REGISTRY_PATH="$qualification_root/instance-registry.json"
          export SERVICE_LASSO_HOST_PORT_REGISTRY_PATH="$qualification_root/host-port-registry.json"
          export SERVICE_LASSO_TEST_SERVICES_ROOT="$qualification_root/runtime-services"
          export SERVICE_LASSO_TEST_EVIDENCE_ROOT="$qualification_root/runtime-evidence"
          export SERVICE_LASSO_TEST_SUPPORT_ROOT="$qualification_root/runtime-support"
          export QUALIFICATION_WORKSPACE_ROOT="$SERVICE_LASSO_WORKSPACE_ROOT"
          export QUALIFICATION_EVIDENCE_ROOT="$qualification_root/evidence"
          export QUALIFICATION_PRIVATE_CUSTODY_ROOT="$qualification_root/private"
          export QUALIFICATION_SAFE_STATE_PATH="$QUALIFICATION_PRIVATE_CUSTODY_ROOT/qualification-state.json"
          export QUALIFICATION_INITIAL_RECEIPT_PATH="$QUALIFICATION_PRIVATE_CUSTODY_ROOT/initial-receipt.json"
          export QUALIFICATION_INITIAL_PROJECTION_PATH="$QUALIFICATION_EVIDENCE_ROOT/initial-projection.json"
          printf '%s\n' \
            "QUALIFICATION_WORKSPACE_ROOT=$QUALIFICATION_WORKSPACE_ROOT" \
            "SERVICE_LASSO_WORKSPACE_ROOT=$SERVICE_LASSO_WORKSPACE_ROOT" \
            "SERVICE_LASSO_INSTANCE_REGISTRY_PATH=$SERVICE_LASSO_INSTANCE_REGISTRY_PATH" \
            "SERVICE_LASSO_HOST_PORT_REGISTRY_PATH=$SERVICE_LASSO_HOST_PORT_REGISTRY_PATH" \
            "SERVICE_LASSO_TEST_SERVICES_ROOT=$SERVICE_LASSO_TEST_SERVICES_ROOT" \
            "SERVICE_LASSO_TEST_EVIDENCE_ROOT=$SERVICE_LASSO_TEST_EVIDENCE_ROOT" \
            "SERVICE_LASSO_TEST_SUPPORT_ROOT=$SERVICE_LASSO_TEST_SUPPORT_ROOT" \
            "QUALIFICATION_PRIVATE_CUSTODY_ROOT=$QUALIFICATION_PRIVATE_CUSTODY_ROOT" \
            "QUALIFICATION_EVIDENCE_ROOT=$QUALIFICATION_EVIDENCE_ROOT" \
            "QUALIFICATION_SAFE_STATE_PATH=$QUALIFICATION_SAFE_STATE_PATH" \
            "QUALIFICATION_INITIAL_RECEIPT_PATH=$QUALIFICATION_INITIAL_RECEIPT_PATH" \
            "QUALIFICATION_INITIAL_PROJECTION_PATH=$QUALIFICATION_INITIAL_PROJECTION_PATH" \
            >> "$GITHUB_ENV"
          node scripts/record-packaged-admin-first-custody.mjs
          node scripts/project-packaged-admin-first-custody.mjs --input "$QUALIFICATION_INITIAL_RECEIPT_PATH" --journal "$QUALIFICATION_PRIVATE_CUSTODY_ROOT/first-custody-journal.json" --output "$QUALIFICATION_INITIAL_PROJECTION_PATH"
          test -s "$QUALIFICATION_INITIAL_PROJECTION_PATH"

      - name: Check out exact qualified Admin browser harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: service-lasso/lasso-serviceadmin
          ref: ${{ env.ADMIN_HARNESS_REVISION }}
          path: qualification/admin

      - name: Bind exact separate Admin checkout before dependencies
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C qualification/admin rev-parse HEAD)" = "$ADMIN_HARNESS_REVISION"
          test -z "$(git -C qualification/admin -c core.autocrlf=false status --porcelain=v1 --untracked-files=all)"
          core_custody_scripts="$GITHUB_WORKSPACE/scripts"
          admin_custody_workspace="$GITHUB_WORKSPACE/qualification/admin"
          admin_custody_root="$RUNNER_TEMP/admin-harness-custody-$GITHUB_RUN_ID-$GITHUB_JOB-$GITHUB_RUN_ATTEMPT-$QUALIFICATION_PLATFORM"
          (
            cd "$admin_custody_workspace"
            export GITHUB_WORKSPACE="$admin_custody_workspace"
            export QUALIFICATION_CANDIDATE_SHA="$ADMIN_HARNESS_REVISION"
            export QUALIFICATION_PRIVATE_CUSTODY_ROOT="$admin_custody_root/private"
            export QUALIFICATION_EVIDENCE_ROOT="$admin_custody_root/evidence"
            export QUALIFICATION_INITIAL_RECEIPT_PATH="$QUALIFICATION_PRIVATE_CUSTODY_ROOT/initial-receipt.json"
            export QUALIFICATION_INITIAL_PROJECTION_PATH="$QUALIFICATION_EVIDENCE_ROOT/initial-projection.json"
            export SERVICE_LASSO_WORKSPACE_ROOT="$admin_custody_root/workspace"
            export SERVICE_LASSO_INSTANCE_REGISTRY_PATH="$admin_custody_root/instance-registry.json"
            export SERVICE_LASSO_HOST_PORT_REGISTRY_PATH="$admin_custody_root/host-port-registry.json"
            node "$core_custody_scripts/record-packaged-admin-first-custody.mjs"
            node "$core_custody_scripts/project-packaged-admin-first-custody.mjs" --input "$QUALIFICATION_INITIAL_RECEIPT_PATH" --journal "$QUALIFICATION_PRIVATE_CUSTODY_ROOT/first-custody-journal.json" --output "$QUALIFICATION_INITIAL_PROJECTION_PATH"
            test -s "$QUALIFICATION_INITIAL_PROJECTION_PATH"
          )

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Set up isolated pinned pnpm action entrypoint
        id: pnpm-action-pinned-entrypoint
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.5
          dest: ${{ runner.temp }}/pnpm-action-pinned-entrypoint

      - name: Install exact Admin browser harness dependencies
        working-directory: qualification/admin
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm exec cypress install

      - name: Establish exact trusted-unlock receipt caller
        working-directory: qualification/admin
        shell: bash
        env:
          PNPM_ACTION_BIN_DEST: ${{ steps.pnpm-action-pinned-entrypoint.outputs.bin_dest }}
          ADMIN_PNPM_PREFIX: ${{ runner.temp }}/admin-trusted-unlock-pnpm-10.34.5
          QUALIFICATION_PLATFORM: ${{ matrix.platform }}
        run: |
          set -euo pipefail
          node "$GITHUB_WORKSPACE/scripts/establish-admin-trusted-unlock-receipt-caller.mjs"

      - name: Verify and prepare published packages
        id: prepare
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          QUALIFICATION_PRIVATE_STATE_PATH: ${{ runner.temp }}/qualification-private-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.platform }}.json
        run: |
          set -euo pipefail
          test "$(git -C qualification/admin rev-parse HEAD)" = "$ADMIN_HARNESS_REVISION"
          node scripts/prepare-published-package-qualification.mjs

      - name: Bind exact qualification fixture source
        shell: bash
        run: |
          set -euo pipefail
          source_head="$(git rev-parse HEAD)"
          source_tree="$(git rev-parse HEAD^{tree})"
          printf '%s\n' \
            "SERVICE_LASSO_TEST_SOURCE_HEAD=$source_head" \
            "SERVICE_LASSO_TEST_SOURCE_TREE=$source_tree" >> "$GITHUB_ENV"

      - name: Drive released Admin full browser contracts
        id: qualify
        working-directory: qualification/admin
        shell: bash
        env:
          SERVICE_LASSO_REQUIRE_TEST_BROKER_BINARY: "1"
          SERVICE_LASSO_WORKSPACE_ROOT: ${{ env.SERVICE_LASSO_WORKSPACE_ROOT }}
          SERVICE_LASSO_INSTANCE_REGISTRY_PATH: ${{ env.SERVICE_LASSO_INSTANCE_REGISTRY_PATH }}
          SERVICE_LASSO_HOST_PORT_REGISTRY_PATH: ${{ env.SERVICE_LASSO_HOST_PORT_REGISTRY_PATH }}
          SERVICE_LASSO_TEST_SERVICES_ROOT: ${{ env.SERVICE_LASSO_TEST_SERVICES_ROOT }}
          SERVICE_LASSO_TEST_EVIDENCE_ROOT: ${{ env.SERVICE_LASSO_TEST_EVIDENCE_ROOT }}
          SERVICE_LASSO_TEST_SUPPORT_ROOT: ${{ env.SERVICE_LASSO_TEST_SUPPORT_ROOT }}
          SERVICE_LASSO_TEST_SOURCE_HEAD: ${{ env.SERVICE_LASSO_TEST_SOURCE_HEAD }}
          SERVICE_LASSO_TEST_SOURCE_TREE: ${{ env.SERVICE_LASSO_TEST_SOURCE_TREE }}
        run: |
          set -euo pipefail
          test "$QUALIFICATION_PREPARED" = "1"
          pnpm test:secrets:real-first-run-browser
          echo "QUALIFICATION_FIRST_RUN=success" >> "$GITHUB_ENV"
          "$ADMIN_PNPM_NODE" "$GITHUB_WORKSPACE/scripts/consume-admin-trusted-unlock-receipt.mjs" --receipt "$RUNNER_TEMP/admin-trusted-unlock-receipt.json" -- "$ADMIN_PNPM_NODE" "$ADMIN_PNPM_ENTRYPOINT" test:secrets:real-browser
          echo "QUALIFICATION_LIFECYCLE=success" >> "$GITHUB_ENV"
          pnpm test:secrets:real-stopped-lifecycle-browser
          echo "QUALIFICATION_STOPPED_LIFECYCLE=success" >> "$GITHUB_ENV"
          if [ "$RUNNER_OS" = "Windows" ]; then
            pnpm test:secrets:real-lockout-browser
            echo "QUALIFICATION_LOCKOUT=success" >> "$GITHUB_ENV"
          fi

      - name: Prove owned process and filesystem cleanup convergence
        id: cleanup
        if: always()
        shell: bash
        env:
          QUALIFICATION_PRIVATE_STATE_PATH: ${{ runner.temp }}/qualification-private-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.platform }}.json
        run: node scripts/cleanup-published-package-qualification.mjs

      - name: Record metadata-only terminal evidence
        if: always()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          QUALIFICATION_JOB_NAME: published-package-qualification (${{ matrix.platform }})
          PREPARE_OUTCOME: ${{ steps.prepare.outcome }}
          QUALIFICATION_OUTCOME: ${{ steps.qualify.outcome }}
          CLEANUP_OUTCOME: ${{ steps.cleanup.outcome }}
          ADMIN_TRUSTED_UNLOCK_RECEIPT_PATH: ${{ runner.temp }}/admin-trusted-unlock-receipt.json
          ADMIN_TRUSTED_UNLOCK_PREBROWSER_FAILURE_PATH: ${{ env.ADMIN_TRUSTED_UNLOCK_PREBROWSER_FAILURE_PATH }}
          QUALIFICATION_INITIAL_PROJECTION_PATH: ${{ env.QUALIFICATION_INITIAL_PROJECTION_PATH }}
        run: node scripts/record-published-package-qualification.mjs

      - name: Upload retained platform evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: published-package-qualification-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.QUALIFICATION_EVIDENCE_ROOT }}/
          if-no-files-found: error
          retention-days: 90

  require-published-package-qualification:
    name: require-published-package-qualification
    if: always()
    needs:
      - published-package-qualification
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    env:
      CORE_RELEASE_ID: ${{ inputs.core_release_id }}
      CORE_RELEASE_TAG: ${{ inputs.core_release_tag }}
      CORE_REVISION: ${{ inputs.core_revision }}
      CORE_NPM_VERSION: ${{ inputs.core_npm_version }}
      CORE_NPM_INTEGRITY: ${{ inputs.core_npm_integrity }}
      CORE_WIN32_SHA256: ${{ inputs.core_win32_sha256 }}
      CORE_LINUX_SHA256: ${{ inputs.core_linux_sha256 }}
      CORE_DARWIN_SHA256: ${{ inputs.core_darwin_sha256 }}
    steps:
      - name: Check out exact aggregate verifier
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}

      - name: Download exact current-run artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          QUALIFICATION_ARTIFACTS_ROOT: ${{ runner.temp }}/published-package-artifact-readback
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --dir "$QUALIFICATION_ARTIFACTS_ROOT"

      - name: Read back artifact API and verify all terminal evidence
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          QUALIFICATION_ARTIFACTS_ROOT: ${{ runner.temp }}/published-package-artifact-readback
        run: node scripts/verify-published-package-qualification-artifacts.mjs

      - name: Require terminal-green three-platform jobs
        shell: bash
        run: test '${{ needs.published-package-qualification.result }}' = 'success'
