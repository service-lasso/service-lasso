name: Lifecycle process tree

on:
  pull_request:
    branches:
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lifecycle-process-tree:
    name: lifecycle-process-tree (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build runtime
        run: npm run build

      - name: Verify lifecycle ownership and process-tree cleanup
        env:
          SERVICE_LASSO_INSTANCE_REGISTRY_PATH: ${{ runner.temp }}/service-lasso-test-instances.json
        run: node --test --test-concurrency=1 tests/process-ownership.test.js tests/lifecycle-actions.test.js tests/process-tree-exit-race.test.js tests/managed-process-deadline.test.js tests/real-admin-browser-rollback-fixture.test.js
