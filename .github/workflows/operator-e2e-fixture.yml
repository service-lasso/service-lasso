name: Ordinary operator E2E fixture
on:
  pull_request:
    branches: [develop]
    paths:
      - 'scripts/operator-e2e-fixture*'
      - 'scripts/verify-operator-e2e-fixture.mjs'
      - 'tests/operator-e2e-fixture.test.js'
      - 'tests/operator-source-e2e-lifecycle.test.js'
      - '.github/workflows/operator-e2e-fixture.yml'
  push:
    branches: [develop]
    paths:
      - 'scripts/operator-e2e-fixture*'
      - 'scripts/verify-operator-e2e-fixture.mjs'
      - 'tests/operator-e2e-fixture.test.js'
      - 'tests/operator-source-e2e-lifecycle.test.js'
      - '.github/workflows/operator-e2e-fixture.yml'
permissions:
  contents: read
jobs:
  fixture:
    name: ordinary source fixture (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.23.2'
          cache: npm
      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify Windows private setup directly before controller tests
        if: runner.os == 'Windows'
        run: node --test --test-timeout=90000 --test-name-pattern="reusable private root and exclusive JSON" tests/operator-e2e-fixture.test.js
      - name: Verify actual private paths and protocol refusal/teardown
        run: node --test --test-timeout=90000 tests/operator-e2e-fixture.test.js
      - name: Fresh actual Core source fixture (Linux)
        if: runner.os == 'Linux'
        run: node scripts/verify-operator-e2e-fixture.mjs --output-dir "${{ runner.temp }}/operator-e2e-actual"
      - name: Fresh actual Core source fixture and authentication (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $node = (Get-Command node).Source
          $npmCli = Join-Path (Split-Path $node) 'node_modules/npm/bin/npm-cli.js'
          & $node scripts/verify-operator-e2e-fixture.mjs --output-dir (Join-Path $env:RUNNER_TEMP 'operator-e2e-actual') --npm-cli $npmCli
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Linux actual five-action source API lifecycle and control preservation
        if: runner.os == 'Linux'
        run: node --test --test-concurrency=1 tests/operator-source-e2e-lifecycle.test.js
      - name: Upload sanitized ordinary fixture receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ordinary-fixture-${{ matrix.os }}
          path: ${{ runner.temp }}/operator-e2e-actual/receipt.json
          if-no-files-found: warn
          retention-days: 14
