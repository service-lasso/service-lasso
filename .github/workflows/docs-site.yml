name: Docs Site

on:
  workflow_dispatch:
  pull_request:
    branches:
      - develop
    paths:
      - ".github/workflows/docs-site.yml"
      - "docs/**"
      - ".governance/project/BACKLOG.md"
      - ".governance/specs/SPEC-007-secrets-capability-ledger.md"
      - "package.json"
      - "package-lock.json"
      - "scripts/check-secrets-capability-ledger.mjs"
  push:
    branches:
      - develop
      - main
    paths:
      - ".github/workflows/docs-site.yml"
      - "docs/**"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

concurrency:
  group: docs-site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Reject critical and high tooling vulnerabilities
        run: npm run audit:tooling

      - name: Validate Secrets capability ledger
        run: npm run docs:check-secrets-ledger

      - name: Build Docusaurus site
        run: npm run docs:build

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: docs/build

  deploy:
    name: Deploy docs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
