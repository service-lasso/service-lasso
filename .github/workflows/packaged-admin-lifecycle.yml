name: Packaged Admin Lifecycle Acceptance

on:
  workflow_dispatch:
  pull_request:
    branches:
      - develop
    paths:
      - .github/workflows/packaged-admin-lifecycle.yml
      - services/@serviceadmin/service.json
      - services/@secretsbroker/service.json
      - src/runtime/**
      - src/server/**
      - tests/fixtures/real-admin-browser-runner.mjs
  push:
    branches:
      - develop
    paths:
      - .github/workflows/packaged-admin-lifecycle.yml
      - services/@serviceadmin/service.json
      - services/@secretsbroker/service.json
      - src/runtime/**
      - src/server/**
      - tests/fixtures/real-admin-browser-runner.mjs

concurrency:
  group: packaged-admin-lifecycle-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  packaged-admin-lifecycle:
    name: packaged-admin-lifecycle (${{ matrix.admin_platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            admin_platform: linux
            admin_asset: "@serviceadmin-linux.tar.gz"
            admin_sha256: 8f80b124967fa1e0efe9fa4c6c0d3aaa9f4f64ffdd15d1180359d2c6185d3e71
            broker_asset: secretsbroker-linux.tar.gz
            broker_binary: secretsbroker
            broker_sha256: 3466c9adf01d14b202fd084705bfda11fef627206587a0ad1f62dbb6a6a4f295
          - os: windows-latest
            admin_platform: win32
            admin_asset: "@serviceadmin-win32.zip"
            admin_sha256: fe5e5fe01d1202f3874097e6223652d634c94677c765c5f82d20e6d274c0161c
            broker_asset: secretsbroker-win32.zip
            broker_binary: secretsbroker.exe
            broker_sha256: e64ee6a85c053c6dd68e2713477dae0620a458496bbd41077b55cc4c2df3f966
          - os: macos-latest
            admin_platform: darwin
            admin_asset: "@serviceadmin-darwin.tar.gz"
            admin_sha256: 2b5cdd80861819a7eb6f92ed5743c208baae8b35e7f4232fd3df928f34bfcb81
            broker_asset: secretsbroker-darwin.tar.gz
            broker_binary: secretsbroker
            broker_sha256: 567b40bbd42881c5a4e12c2b8984ece9b5225d221ecf2d776fb541e330365ce5
    env:
      ADMIN_RELEASE_ID: "380051618"
      ADMIN_RELEASE_TAG: "2026.8.31-f015b44"
      ADMIN_REVISION: "f015b4445b0526546a309301270186a697588166"
      BROKER_RELEASE_ID: "379635299"
      BROKER_RELEASE_TAG: "2026.8.31-f340883"
      BROKER_REVISION: "f340883056ec3cf74b535fb46490b39382e8c823"

    steps:
      - name: Check out candidate Core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Check out exact qualified Admin harness
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: service-lasso/lasso-serviceadmin
          ref: f015b4445b0526546a309301270186a697588166
          path: qualification/admin

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.34.5

      - name: Install and build candidate Core
        run: |
          npm ci
          npm run build

      - name: Install exact Admin browser harness
        working-directory: qualification/admin
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm exec cypress install

      - name: Acquire checksum-bound published Admin and Broker
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EXPECTED_ADMIN_ASSET: ${{ matrix.admin_asset }}
          EXPECTED_ADMIN_SHA256: ${{ matrix.admin_sha256 }}
          EXPECTED_BROKER_ASSET: ${{ matrix.broker_asset }}
          EXPECTED_BROKER_SHA256: ${{ matrix.broker_sha256 }}
          EXPECTED_BROKER_BINARY: ${{ matrix.broker_binary }}
        run: |
          $ErrorActionPreference = 'Stop'

          function Invoke-CoreInstall([string]$serviceId, [string]$servicesRoot, [string]$workspaceRoot) {
            $output = @(& node dist/cli.js install $serviceId --services-root $servicesRoot --workspace-root $workspaceRoot --json)
            if ($LASTEXITCODE -ne 0) {
              throw "Core install failed for $serviceId."
            }
            try {
              return (($output -join "`n") | ConvertFrom-Json)
            } catch {
              throw "Core install did not return the expected JSON contract for $serviceId."
            }
          }

          function Assert-AcquiredArtifact(
            [object]$payload,
            [string]$serviceId,
            [string]$expectedTag,
            [string]$expectedAsset,
            [string]$expectedSha
          ) {
            if (-not $payload.ok -or $payload.action -ne 'install') {
              throw "Core install contract failed for $serviceId."
            }
            $artifact = $payload.state.installArtifacts.artifact
            if (-not $artifact -or $artifact.tag -ne $expectedTag -or $artifact.assetName -ne $expectedAsset) {
              throw "Core acquired unexpected release metadata for $serviceId."
            }
            if (-not $artifact.checksum -or $artifact.checksum.algorithm -ne 'sha256') {
              throw "Core omitted SHA-256 evidence for $serviceId."
            }
            if ($artifact.checksum.source -ne 'release-asset' -or $artifact.checksum.checksumAssetName -ne 'SHA256SUMS.txt') {
              throw "Core did not verify $serviceId through the published checksum manifest."
            }
            if ($artifact.checksum.expected.ToLowerInvariant() -ne $expectedSha) {
              throw "Core resolved an unexpected checksum for $serviceId."
            }
            if ($artifact.checksum.actual.ToLowerInvariant() -ne $expectedSha) {
              throw "Core downloaded an unexpected archive for $serviceId."
            }
            if (-not (Test-Path -LiteralPath $artifact.archivePath -PathType Leaf)) {
              throw "Core did not retain the verified archive for $serviceId."
            }
            if (-not (Test-Path -LiteralPath $artifact.extractedPath -PathType Container)) {
              throw "Core did not extract the verified archive for $serviceId."
            }
            return $artifact
          }

          $servicesRoot = Join-Path $env:RUNNER_TEMP 'packaged-admin-services'
          $workspaceRoot = Join-Path $env:RUNNER_TEMP 'packaged-admin-workspace'
          New-Item -ItemType Directory -Path $servicesRoot, $workspaceRoot | Out-Null
          Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'services/@serviceadmin') -Destination $servicesRoot -Recurse
          Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE 'services/@secretsbroker') -Destination $servicesRoot -Recurse

          $adminPayload = Invoke-CoreInstall '@serviceadmin' $servicesRoot $workspaceRoot
          $adminArtifact = Assert-AcquiredArtifact `
            $adminPayload `
            '@serviceadmin' `
            $env:ADMIN_RELEASE_TAG `
            $env:EXPECTED_ADMIN_ASSET `
            $env:EXPECTED_ADMIN_SHA256

          $brokerPayload = Invoke-CoreInstall '@secretsbroker' $servicesRoot $workspaceRoot
          $brokerArtifact = Assert-AcquiredArtifact `
            $brokerPayload `
            '@secretsbroker' `
            $env:BROKER_RELEASE_TAG `
            $env:EXPECTED_BROKER_ASSET `
            $env:EXPECTED_BROKER_SHA256

          $brokerBinaries = @(
            Get-ChildItem -LiteralPath $brokerArtifact.extractedPath -Filter $env:EXPECTED_BROKER_BINARY -File -Recurse
          )
          if ($brokerBinaries.Count -ne 1) {
            throw 'The verified Broker archive did not contain exactly one expected executable.'
          }
          $brokerBinary = $brokerBinaries[0]
          if ($env:RUNNER_OS -ne 'Windows') {
            & chmod +x $brokerBinary.FullName
            if ($LASTEXITCODE -ne 0) {
              throw 'The verified Broker executable could not be made executable.'
            }
          }

          "SERVICE_LASSO_TEST_ADMIN_ROOT=$($adminArtifact.extractedPath)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "SERVICE_LASSO_TEST_BROKER_BINARY=$($brokerBinary.FullName)" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "ADMIN_ARCHIVE_SHA256=$($adminArtifact.checksum.actual.ToLowerInvariant())" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append
          "BROKER_ARCHIVE_SHA256=$($brokerArtifact.checksum.actual.ToLowerInvariant())" | Out-File $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Bind exact source revisions
        id: revisions
        shell: bash
        run: |
          set -euo pipefail
          core_revision="$(git rev-parse HEAD)"
          admin_revision="$(git -C qualification/admin rev-parse HEAD)"
          test "$admin_revision" = "$ADMIN_REVISION"
          echo "core_revision=$core_revision" >> "$GITHUB_OUTPUT"
          echo "SERVICE_LASSO_TEST_CORE_REVISION=$core_revision" >> "$GITHUB_ENV"
          echo "SERVICE_LASSO_TEST_BROKER_REVISION=$BROKER_REVISION" >> "$GITHUB_ENV"

      - name: Drive released Admin lifecycle browser contracts
        id: qualify
        working-directory: qualification/admin
        shell: bash
        env:
          SERVICE_LASSO_TEST_CORE_ROOT: ${{ github.workspace }}
          SERVICE_LASSO_REQUIRE_TEST_BROKER_BINARY: "1"
        run: |
          set -euo pipefail
          pnpm test:secrets:real-first-run-browser
          pnpm test:secrets:real-browser
          pnpm test:secrets:real-stopped-lifecycle-browser
          if [ "$RUNNER_OS" = "Windows" ]; then
            pnpm test:secrets:real-lockout-browser
          fi

      - name: Record metadata-only packaged acceptance evidence
        if: always()
        shell: pwsh
        env:
          QUALIFICATION_OUTCOME: ${{ steps.qualify.outcome }}
          CORE_REVISION: ${{ steps.revisions.outputs.core_revision }}
          ADMIN_PLATFORM: ${{ matrix.admin_platform }}
          ADMIN_ASSET: ${{ matrix.admin_asset }}
          ADMIN_EXPECTED_SHA256: ${{ matrix.admin_sha256 }}
          BROKER_ASSET: ${{ matrix.broker_asset }}
          BROKER_EXPECTED_SHA256: ${{ matrix.broker_sha256 }}
        run: |
          $ErrorActionPreference = 'Stop'
          $hex64 = '^[0-9a-f]{64}$'
          if ($env:CORE_REVISION -notmatch '^[0-9a-f]{40}$' -or $env:ADMIN_REVISION -notmatch '^[0-9a-f]{40}$' -or $env:BROKER_REVISION -notmatch '^[0-9a-f]{40}$') {
            throw 'Packaged acceptance revision evidence is invalid.'
          }
          if ($env:ADMIN_ARCHIVE_SHA256 -notmatch $hex64 -or $env:BROKER_ARCHIVE_SHA256 -notmatch $hex64) {
            throw 'Packaged acceptance archive evidence is missing or invalid.'
          }
          if ($env:ADMIN_ARCHIVE_SHA256 -ne $env:ADMIN_EXPECTED_SHA256 -or $env:BROKER_ARCHIVE_SHA256 -ne $env:BROKER_EXPECTED_SHA256) {
            throw 'Packaged acceptance archive evidence does not match the pinned releases.'
          }

          $modes = @('first_run', 'comprehensive_lifecycle', 'stopped_lifecycle')
          if ($env:RUNNER_OS -eq 'Windows') {
            $modes += 'local_operator_lockout'
          }
          $evidence = [ordered]@{
            schema = 'service-lasso.packaged-admin-lifecycle.v1'
            retainedContent = 'metadata_only'
            outcome = $env:QUALIFICATION_OUTCOME
            platform = $env:ADMIN_PLATFORM
            core = [ordered]@{
              revision = $env:CORE_REVISION
            }
            admin = [ordered]@{
              revision = $env:ADMIN_REVISION
              releaseId = $env:ADMIN_RELEASE_ID
              tag = $env:ADMIN_RELEASE_TAG
              asset = $env:ADMIN_ASSET
              sha256 = $env:ADMIN_ARCHIVE_SHA256
              checksumSource = 'SHA256SUMS.txt'
            }
            broker = [ordered]@{
              revision = $env:BROKER_REVISION
              releaseId = $env:BROKER_RELEASE_ID
              tag = $env:BROKER_RELEASE_TAG
              asset = $env:BROKER_ASSET
              sha256 = $env:BROKER_ARCHIVE_SHA256
              checksumSource = 'SHA256SUMS.txt'
            }
            browser = [ordered]@{
              modes = $modes
              mutationRetry = $false
              capturesRetained = $false
              sensitiveEvidenceRetained = $false
            }
          }
          New-Item -ItemType Directory -Path artifacts -Force | Out-Null
          $evidence | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath "artifacts/packaged-admin-lifecycle-$env:ADMIN_PLATFORM.json" -Encoding utf8

      - name: Upload packaged Admin lifecycle evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: packaged-admin-lifecycle-${{ matrix.admin_platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/packaged-admin-lifecycle-${{ matrix.admin_platform }}.json
          if-no-files-found: error
          retention-days: 90

  require-packaged-admin-lifecycle:
    if: always()
    needs:
      - packaged-admin-lifecycle
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Require all packaged Admin lifecycle platforms
        shell: bash
        run: |
          set -euo pipefail
          test '${{ needs.packaged-admin-lifecycle.result }}' = 'success'
