name: Terminal UI E2E

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/terminal-ui-e2e.yml"
      - "scripts/verify-terminal-ui-e2e.mjs"
      - "src/contracts/service.ts"
      - "src/runtime/discovery/validateManifest.ts"
      - "src/runtime/execution/supervisor.ts"
      - "src/server/index.ts"

permissions:
  contents: read

jobs:
  terminal-ui:
    name: terminal-ui (ubuntu-latest)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out Core
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out pinned Service Admin
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: service-lasso/lasso-serviceadmin
          ref: 1757686812a96c145dba16e36306dfce5b667476
          path: qualification/admin

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.5

      - name: Install Core dependencies
        run: npm ci

      - name: Build Core
        run: npm run build

      - name: Install Service Admin dependencies
        working-directory: qualification/admin
        run: pnpm install --frozen-lockfile

      - name: Download the pinned PTY helper
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pty"
          gh release download v0.1.1 \
            --repo service-lasso/service-lasso-pty \
            --pattern service-lasso-pty-linux-amd64 \
            --dir "$RUNNER_TEMP/pty"
          chmod +x "$RUNNER_TEMP/pty/service-lasso-pty-linux-amd64"

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Drive the real Echo TUI through the Admin terminal
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SERVICE_LASSO_RELEASE_METADATA_TOKEN: ${{ github.token }}
          SERVICE_LASSO_PTY_HELPER: ${{ runner.temp }}/pty/service-lasso-pty-linux-amd64
          SERVICEADMIN_REPO_ROOT: ${{ github.workspace }}/qualification/admin
          SERVICE_LASSO_TERMINAL_UI_PORT: "4180"
        run: node scripts/verify-terminal-ui-e2e.mjs
