name: MCP Product Acceptance

on:
  workflow_dispatch:
  pull_request:
    branches:
      - develop
    paths:
      - .gitattributes
      - .github/workflows/mcp-product-acceptance.yml
      - .github/workflows/release-qualification.yml
      - .governance/project/BACKLOG.md
      - .governance/project/PROJECT_INTENT.md
      - .governance/specs/SPEC-006-operator-mcp.md
      - docs/reference/operator-mcp.md
      - docs/reference/process-ownership-registry.md
      - package.json
      - package-lock.json
      - scripts/copy-runtime-assets.mjs
      - scripts/mcp-product-acceptance-lib.mjs
      - scripts/mcp-packaged-consumer-runner.mjs
      - scripts/demo-verify-canonical.mjs
      - scripts/verify-mcp-packaged.mjs
      - scripts/verify-windows-process-inspector.ps1
      - scripts/verify-windows-dpapi-helper.ps1
      - scripts/verify-mcp-product-artifact.mjs
      - scripts/verify-mcp-product-acceptance-run.mjs
      - scripts/publish-package-lib.mjs
      - src/runtime/execution/supervisor.ts
      - src/runtime/execution/windows-managed-launcher.ps1
      - src/runtime/lifecycle/actions.ts
      - src/runtime/operator/**
      - src/runtime/security/private-json.ts
      - src/runtime/security/windows-dpapi-helper.cs
      - src/runtime/security/windows-dpapi-helper.exe
      - src/runtime/security/windows-dpapi-helper.provenance.json
      - src/runtime/process/identity.ts
      - src/runtime/process/registry.ts
      - src/runtime/process/tree.ts
      - src/runtime/process/windows-process-inspector.cs
      - src/runtime/process/windows-process-inspector.exe
      - src/runtime/process/windows-process-inspector.provenance.json
      - src/runtime/setup/definition-revision.ts
      - src/server/**
      - tests/process-ownership.test.js
      - tests/private-json.test.js
      - tests/operator-mcp*.test.js
      - tests/fixtures/current-process-identity-runner.mjs
      - tests/demo-instance.test.js
      - tests/mcp-product-artifact.test.js
      - docs/reference/secrets-capability-ledger.json
      - docs/reference/secrets-capability-ledger.md
  push:
    branches:
      - develop
    paths:
      - .gitattributes
      - .github/workflows/mcp-product-acceptance.yml
      - .github/workflows/release-qualification.yml
      - .governance/project/BACKLOG.md
      - .governance/project/PROJECT_INTENT.md
      - .governance/specs/SPEC-006-operator-mcp.md
      - docs/reference/operator-mcp.md
      - docs/reference/process-ownership-registry.md
      - package.json
      - package-lock.json
      - scripts/copy-runtime-assets.mjs
      - scripts/mcp-product-acceptance-lib.mjs
      - scripts/mcp-packaged-consumer-runner.mjs
      - scripts/demo-verify-canonical.mjs
      - scripts/verify-mcp-packaged.mjs
      - scripts/verify-windows-process-inspector.ps1
      - scripts/verify-windows-dpapi-helper.ps1
      - scripts/verify-mcp-product-artifact.mjs
      - scripts/verify-mcp-product-acceptance-run.mjs
      - scripts/publish-package-lib.mjs
      - src/runtime/execution/supervisor.ts
      - src/runtime/execution/windows-managed-launcher.ps1
      - src/runtime/lifecycle/actions.ts
      - src/runtime/operator/**
      - src/runtime/security/private-json.ts
      - src/runtime/security/windows-dpapi-helper.cs
      - src/runtime/security/windows-dpapi-helper.exe
      - src/runtime/security/windows-dpapi-helper.provenance.json
      - src/runtime/process/identity.ts
      - src/runtime/process/registry.ts
      - src/runtime/process/tree.ts
      - src/runtime/process/windows-process-inspector.cs
      - src/runtime/process/windows-process-inspector.exe
      - src/runtime/process/windows-process-inspector.provenance.json
      - src/runtime/setup/definition-revision.ts
      - src/server/**
      - tests/process-ownership.test.js
      - tests/private-json.test.js
      - tests/operator-mcp*.test.js
      - tests/fixtures/current-process-identity-runner.mjs
      - tests/demo-instance.test.js
      - tests/mcp-product-artifact.test.js
      - docs/reference/secrets-capability-ledger.json
      - docs/reference/secrets-capability-ledger.md

concurrency:
  group: mcp-product-acceptance-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  mcp-source-conformance:
    name: mcp-source-conformance
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ env.CANDIDATE_SHA }}

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Run blocking MCP source conformance matrix
        run: npm run test:mcp:product

      - name: Build tested operator documentation
        run: npm run docs:build

  mcp-packaged:
    name: mcp-packaged (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win32
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: darwin
    steps:
      - name: Check out exact candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ env.CANDIDATE_SHA }}

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Compute candidate package version
        shell: pwsh
        run: |
          $shortSha = $env:CANDIDATE_SHA.Substring(0, 7)
          $dateUtc = [DateTime]::UtcNow.ToString('yyyy.M.d')
          "SERVICE_LASSO_RELEASE_VERSION=$dateUtc-$shortSha" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify fresh-consumer packaged MCP and canonical action
        env:
          MCP_PRODUCT_EVIDENCE_PATH: artifacts/mcp-product-${{ matrix.platform }}.json
        run: npm run verify:mcp:packaged

      - name: Upload exact-SHA metadata-only MCP product evidence
        id: mcp_product_artifact
        uses: actions/upload-artifact@v6
        with:
          name: mcp-product-acceptance-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/mcp-product-${{ matrix.platform }}.json
          if-no-files-found: error
          retention-days: 90

      - name: Download and validate retained MCP product evidence
        env:
          GH_TOKEN: ${{ github.token }}
          MCP_PRODUCT_PLATFORM: ${{ matrix.platform }}
          MCP_PRODUCT_ARTIFACT_ID: ${{ steps.mcp_product_artifact.outputs.artifact-id }}
          MCP_PRODUCT_ARTIFACT_NAME: mcp-product-acceptance-${{ matrix.platform }}-${{ github.run_id }}-${{ github.run_attempt }}
          MCP_PRODUCT_ARTIFACT_DIGEST: ${{ steps.mcp_product_artifact.outputs.artifact-digest }}
        run: node scripts/verify-mcp-product-artifact.mjs

  require-mcp-product-acceptance:
    if: ${{ always() }}
    needs:
      - mcp-source-conformance
      - mcp-packaged
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Require source and three-OS packaged acceptance
        shell: bash
        run: |
          set -euo pipefail
          test '${{ needs.mcp-source-conformance.result }}' = 'success'
          test '${{ needs.mcp-packaged.result }}' = 'success'

      - name: Check out exact candidate verifier
        uses: actions/checkout@v5
        with:
          ref: ${{ env.CANDIDATE_SHA }}

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install locked verifier dependencies
        run: npm ci

      - name: Read back the complete retained artifact set
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/verify-mcp-product-acceptance-run.mjs
