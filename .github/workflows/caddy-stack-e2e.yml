name: caddy-stack-e2e

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    name: caddy stack (win32)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Checkout lesson fixtures
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: service-lasso/lesson-todo
          ref: develop
          path: lesson-todo

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Core -> Caddy -> php-cgi -> PHP
        run: node scripts/verify-caddy-stack.mjs
        env:
          LESSON_SERVICES_ROOT: ${{ github.workspace }}/lesson-todo/lessons/06-caddy/services
