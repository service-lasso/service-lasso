name: CLI Standalone Binaries

on:
  pull_request:
    branches: [develop]
    paths:
      - 'src/**'
      - 'scripts/build-cli-binary.mjs'
      - 'scripts/verify-cli-binary.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/cli-standalone-binaries.yml'
  push:
    branches: [develop]
    paths:
      - 'src/**'
      - 'scripts/build-cli-binary.mjs'
      - 'scripts/verify-cli-binary.mjs'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/cli-standalone-binaries.yml'

permissions:
  contents: read

jobs:
  native-cli-binary:
    name: native-cli-binary (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: win32-x64
            runner: windows-latest
          - target: linux-x64
            runner: ubuntu-latest
          - target: darwin-x64
            runner: macos-13
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.2
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run verify:cli:binary -- ${{ matrix.target }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: service-lasso-cli-${{ matrix.target }}-${{ github.sha }}
          path: artifacts/cli-binaries/service-lasso-${{ matrix.target }}*
          if-no-files-found: error
          retention-days: 30
