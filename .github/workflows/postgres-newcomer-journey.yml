name: PostgreSQL Newcomer Journey

on:
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-newcomer-journey:
    name: postgres-newcomer-journey (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, platform: win32 }
          - { os: ubuntu-latest, platform: linux }
          - { os: macos-latest, platform: darwin }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: node scripts/verify-postgres-newcomer-journey.mjs
        env:
          POSTGRES_JOURNEY_EVIDENCE: artifacts/postgres-newcomer-${{ matrix.platform }}.json
          POSTGRES_JOURNEY_SOURCE_SHA: ${{ github.sha }}
          POSTGRES_JOURNEY_PLATFORM: ${{ matrix.platform }}
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: postgres-newcomer-${{ matrix.platform }}
          path: artifacts/postgres-newcomer-${{ matrix.platform }}.json
          if-no-files-found: warn
