name: Baseline Start Smoke

on:
  workflow_dispatch:
  pull_request:
    branches:
      - develop

jobs:
  baseline-start-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Check out repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run local/remote auth e2e
        run: npm run verify:auth-e2e

      - name: Run baseline start smoke
        run: npm run verify:baseline-start
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Run real app E2E state gate
        run: npm run verify:real-app-e2e
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Run multi-instance port gate
        run: npm run verify:multi-instance-ports
        env:
          GITHUB_TOKEN: ${{ github.token }}
