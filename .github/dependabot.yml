version: 2
updates:
  - package-ecosystem: "npm"
    directory: /
    target-branch: develop
    ignore:
      # Docusaurus theme-mermaid requires layout-elk ^0.1.9; keep the audited 0.1.9 pin.
      - dependency-name: "@mermaid-js/layout-elk"
        update-types: ["version-update:semver-major"]
      # The MCP SDK version is frozen by the acceptance contract; update only with requalification.
      - dependency-name: "@modelcontextprotocol/sdk"
        update-types: ["version-update:semver-patch"]
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Australia/Sydney
    open-pull-requests-limit: 10
    labels:
      - dependencies
      - npm
    groups:
      production-dependencies:
        dependency-type: production
      development-dependencies:
        dependency-type: development
  - package-ecosystem: "github-actions"
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
      time: "03:30"
      timezone: Australia/Sydney
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
