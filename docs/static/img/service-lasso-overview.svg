<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">Service Lasso — bring your services together</title>
  <desc id="desc">Your app supplies service.json manifests. Service Lasso installs, configures, starts, and monitors those services. Service Admin provides browser controls and Secrets Broker supplies secrets to authorized services.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101e30"/><stop offset="1" stop-color="#112c34"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#69e4be"/><stop offset="1" stop-color="#c2f58b"/></linearGradient>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto"><path d="M0 0 7 3.5 0 7" fill="none" stroke="#69e4be" stroke-width="1.3"/></marker>
  </defs>
  <rect width="1200" height="380" rx="24" fill="url(#bg)"/>
  <circle cx="1130" cy="-15" r="220" fill="none" stroke="#69e4be" stroke-opacity=".08" stroke-width="42"/>
  <circle cx="1130" cy="-15" r="150" fill="none" stroke="#69e4be" stroke-opacity=".07" stroke-width="2"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <!-- Existing Service Admin brand asset: public/images/brand/service-lasso/web-app-manifest-192x192.png; embedded unchanged for standalone GitHub rendering. -->
    <image x="36" y="24" width="68" height="68" href="data:image/png;base64,"/>
    <text x="112" y="60" fill="#f4fafb" font-size="29" font-weight="700">Service Lasso</text>
    <text x="112" y="90" fill="#a9c6cc" font-size="17">Bring your services together.</text>
    <text x="44" y="136" fill="#eff8f7" font-size="21">One place to install, run, and manage the services your app needs.</text>

    <rect x="44" y="184" width="234" height="124" rx="15" fill="#1b3144" stroke="#385364"/>
    <text x="64" y="214" fill="#9bb7c5" font-size="12" letter-spacing="2">START WITH YOUR APP</text>
    <text x="64" y="246" fill="#f4fafb" font-size="23" font-weight="600">Your services</text>
    <text x="64" y="276" fill="#b6cdd5" font-size="17">service.json manifests</text>

    <path d="M282 246 H335" stroke="#69e4be" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <rect x="348" y="175" width="318" height="142" rx="15" fill="#153e3e" stroke="#69e4be" stroke-width="1.5"/>
    <text x="371" y="206" fill="#8ee8cb" font-size="12" letter-spacing="2">THE RUNTIME</text>
    <text x="371" y="244" fill="#f4fafb" font-size="29" font-weight="700">Service Lasso</text>
    <text x="371" y="279" fill="#bde1d8" font-size="17">Install · Configure · Run · Monitor</text>

    <path d="M670 246 H724 V213 H764 M724 246 V290 H764" stroke="#69e4be" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
    <rect x="780" y="175" width="376" height="66" rx="12" fill="#1b3144" stroke="#385364"/>
    <circle cx="805" cy="201" r="5" fill="#69e4be"/>
    <text x="824" y="204" fill="#f4fafb" font-size="19" font-weight="600">Service Admin</text>
    <text x="824" y="226" fill="#b6cdd5" font-size="15">Your browser controls</text>
    <rect x="780" y="253" width="376" height="66" rx="12" fill="#1b3144" stroke="#385364"/>
    <path d="M801 280 V276 A5 5 0 0 1 811 276 V280 M799 280 H813 V290 H799 Z" fill="none" stroke="#ebca85" stroke-width="2"/>
    <text x="824" y="282" fill="#f4fafb" font-size="19" font-weight="600">Secrets Broker</text>
    <text x="824" y="304" fill="#b6cdd5" font-size="15">Secrets for authorized services</text>
    <text x="44" y="349" fill="#a9c6cc" font-size="14">Start from a service template, or bring your existing services.</text>
  </g>
</svg>
